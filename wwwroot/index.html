/* =========================================================================
   English Practice — Mixed Tenses  ·  styled as a photocopied 7th-grade test

     A) Circle the correct answer
     B) Complete with the correct form of the verb
     C) Fill in: Am / Is / Are / Do / Does / Did

const STYLE = `

const TENSES = {
  present_simple:      "Present Simple",
  present_progressive: "Present Progressive",
  future:              "Future",
  past_simple:         "Past Simple",
};
const TENSE_HE = {
  present_simple: "הווה פשוט", present_progressive: "הווה מתמשך", future: "עתיד", past_simple: "עבר פשוט",
};

const SECTIONS = {
  circle:    { he: "הקף את התשובה הנכונה",              en: "Circle the correct answer",         letter: "A" },
  verb:      { he: "השלם בצורת הפועל הנכונה",           en: "Complete with the correct form of the verb", letter: "B" },
  auxiliary: { he: "השלם: Am / Is / Are / Do / Does / Did", en: "Fill in: Am, Is, Are, Do, Does, Did", letter: "C" },
  wh:        { he: "השלם את מילת השאלה (WH)",           en: "Complete the WH question",          letter: "D" },
};
const SECTION_ORDER = ["circle", "verb", "auxiliary", "wh"];
const AUX_TENSES = ["present_simple", "present_progressive", "past_simple"]; // future uses "will", not in this section
const LETTERS = ["a", "b", "c", "d"];
const norm = (s) => (s || "").toString().toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();

async function callClaude(user, system) {
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, messages: [{ role: "user", content: user }] }),
  });
  if (res.status === 401) { location.reload(); throw new Error("auth"); }
  if (!res.ok) throw new Error("proxy " + res.status);
  const data = await res.json();
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  return JSON.parse(text.replace(/```json/gi, "").replace(/```/g, "").trim());
}
const GEN_SYS = "You generate 7th-grade English grammar test items for native Hebrew speakers. Output ONLY valid JSON — no markdown, no code fences, no commentary. Keep 'explanation_he' to at most 10 Hebrew words.";

function promptFor(section, n, tenseList) {
  if (section === "wh")
    return `Generate ${n} "complete the WH question" items at Israeli 7th-grade level. Each item is a natural English question that BEGINS with the blank "___" where a WH question word is missing, and ENDS with a short answer in parentheses that makes the correct WH word clear — e.g. "___ do you go to school? (By bus.)". Use a variety of WH words across the items: What, Where, When, Who, Why, Which, Whose, How, How many, How much, How long, How often. "answers" = the acceptable WH word(s), capitalized. Keep vocabulary simple and everyday. "explanation_he" = one short Hebrew sentence: which WH word fits and what it asks about. Return ONLY JSON: {"items":[{"sentence":"___ do you go to school? (By bus.)","answers":["How"],"explanation_he":"‘By bus’ עונה על אופן הנסיעה → How."}]}`;
  const base = `LEVEL: an Israeli 7th-grade school English test. Use only simple everyday vocabulary and short single-clause sentences — the exact difficulty of these real examples: "The class goes on trips ___.", "My dad ___ (not work) last Saturday.", "___ your mother baking today?", "Mr. Levi ___ a new car 2 weeks ago." Common verbs only (go, play, watch, work, study, buy, travel, eat, drink, sing, dance, run, write, send, talk, meet, practise, like, read, clean, cook, help). Everyday subjects (I/you/he/she/we/they and simple names such as Dan, Rina, Tamar, Guy, Shir). No idioms, no rare words, no long sentences. Mixed tenses, drawn ONLY from: ${tenseList}. Every item includes a clear TIME SIGNAL (e.g. every day, usually, on Mondays, right now, at the moment, yesterday, last night, two days ago, tomorrow, next week) so the tense is inferable. Never name the tense inside the item text. Vary subjects and verbs.`;
  if (section === "circle")
    return `Generate ${n} multiple-choice "circle the correct answer" items. Each: a sentence with one blank "___", exactly 3 options, one correct. Mix items that test the correct verb form with items that test the correct time expression. Give "correct" as the 0-based index. ${base}\nJSON: {"items":[{"stem":"The class goes on trips ___.","options":["yesterday","now","once a month"],"correct":2,"tense":"present_simple","explanation_he":"פעולה קבועה בהווה פשוט."}]}`;
  if (section === "verb")
    return `Generate ${n} "complete with the correct form of the verb" items. Each: a sentence with exactly one blank "___", a base "verb", a boolean "negative" (true when the verb must be negated), and a time signal. "answers" lists all acceptable forms (for negatives include contracted AND full, e.g. "didn't work" and "did not work"). ${base}\nJSON: {"items":[{"sentence":"My dad ___ last Saturday.","verb":"work","negative":true,"answers":["didn't work","did not work"],"tense":"past_simple","explanation_he":"עבר, שלילה didn't + work."}]}`;
  // auxiliary
  return `Generate ${n} "fill in the auxiliary" items using ONLY Am, Is, Are, Do, Does, Did. Each: a QUESTION that BEGINS with the blank "___", plus a time signal. "answers" = the acceptable auxiliary(ies), capitalized as a sentence start. ${base}\nJSON: {"items":[{"sentence":"___ your mother baking today?","answers":["Is"],"tense":"present_progressive","explanation_he":"הווה מתמשך, יחיד → Is."}]}`;
}

function validate(section, arr) {
  return (arr || []).filter(x => {
    if (!x) return false;
    if (section === "circle") return typeof x.stem === "string" && Array.isArray(x.options) && x.options.length >= 2 && Number.isInteger(x.correct) && x.correct < x.options.length;
    if (section === "verb") return typeof x.sentence === "string" && x.sentence.includes("___") && x.verb && Array.isArray(x.answers) && x.answers.length;
    return typeof x.sentence === "string" && x.sentence.includes("___") && Array.isArray(x.answers) && x.answers.length;
  }).map((x, i) => ({ ...x, section, id: `${section[0]}${i}` }));
}

const READ_SYS = "You write simple 7th-grade English reading-comprehension tests for native Hebrew speakers. Output ONLY valid JSON — no markdown, no code fences, no commentary. Keep any 'explanation_he' to at most 12 Hebrew words.";
const READ_TOPICS = ["a girl who saves a forest", "a boy who helps a lost dog", "a class trip to the beach", "a family that starts recycling", "a girl who learns to swim", "a boy who builds a treehouse", "a new student at school", "a girl who starts a school garden", "kids who clean up their park", "a boy who wins a race"];

async function genReading() {
  const topic = READ_TOPICS[Math.floor(Math.random() * READ_TOPICS.length)];
  const pa = `Write a simple 7th-grade English reading passage about ${topic}. Rules: a short title, then about 120 words in short everyday sentences, mixing past and present tense, common vocabulary only (in the style of a "Yael Saves the Forest" school text). Then write comprehension questions ABOUT THE PASSAGE:
- "complete": 5 fill-in items. Each is a sentence with ONE blank "___" whose answer appears in the passage. "answers" = acceptable fill-ins (lowercase).
- "truefalse": 5 statements about the passage, each with a boolean "isTrue".
Each item also gets a short "explanation_he" (Hebrew, pointing to where in the text the answer is).
Return ONLY JSON: {"title":"...","passage":"...","complete":[{"sentence":"Everyone in the town loves the ___.","answers":["forest"],"explanation_he":"..."}],"truefalse":[{"statement":"...","isTrue":true,"explanation_he":"..."}]}`;
  const a = await callClaude(pa, READ_SYS);
  if (!a || !a.passage) throw new Error("no passage");

  const pb = `Passage:\n"""${a.passage}"""\nWrite 3 "answer in full" comprehension questions about this passage. For each give: "question" (English), "model_en" (a short correct answer in English), and "key_points" (2-3 short strings the answer must contain). Return ONLY JSON: {"answer":[{"question":"What did the mayor tell Yael to do?","model_en":"He told her to write a letter.","key_points":["write a letter"]}]}`;
  let b = { answer: [] };
  try { b = await callClaude(pb, READ_SYS); } catch { /* answer-in-full is optional */ }

  return {
    title: a.title || "Reading",
    passage: a.passage,
    complete: (a.complete || []).filter(x => x && typeof x.sentence === "string" && x.sentence.includes("___") && Array.isArray(x.answers) && x.answers.length)
      .slice(0, 5).map((x, i) => ({ ...x, id: `rc${i}`, kind: "complete" })),
    truefalse: (a.truefalse || []).filter(x => x && typeof x.statement === "string" && typeof x.isTrue === "boolean")
      .slice(0, 5).map((x, i) => ({ ...x, id: `rt${i}`, kind: "truefalse" })),
    answer: (b.answer || []).filter(x => x && typeof x.question === "string")
      .slice(0, 3).map((x, i) => ({ ...x, id: `ra${i}`, kind: "answer" })),
  };
}

function EnglishTest() {
  const [screen, setScreen] = useState("setup"); // setup | loading | test
  const [sections, setSections] = useState(new Set(SECTION_ORDER));
  const [tenses, setTenses] = useState(new Set(Object.keys(TENSES)));
  const [count, setCount] = useState(5);
  const [error, setError] = useState("");

  const [items, setItems] = useState([]);          // flat, ordered by section
  const [answers, setAnswers] = useState({});       // id -> string | number(index)
  const [meta, setMeta] = useState({ name: "", cls: "", date: "" });
  const [graded, setGraded] = useState(false);
  const [marks, setMarks] = useState({});           // id -> boolean (correct)
  const [ai, setAi] = useState({});                 // id -> {loading,done,correct,text}
  const [explains, setExplains] = useState({});     // id -> detailed Hebrew explanation
  const [explaining, setExplaining] = useState(false);
  const [reading, setReading] = useState(null);      // {title,passage,complete,truefalse,answer}
  const [openFb, setOpenFb] = useState({});          // answer-in-full id -> feedback_he
  const [gradingOpen, setGradingOpen] = useState(false);

  const toggle = (setter, cur, key, min = 1) => {
    const n = new Set(cur); n.has(key) ? n.delete(key) : n.add(key);
    if (n.size >= min) setter(n);
  };

  async function generate() {
    setError(""); setScreen("loading");
    const chosen = SECTION_ORDER.filter(s => sections.has(s));
    const readingOn = sections.has("reading");
    const pool = [...tenses];
    try {
      const tenseP = chosen.map(sec => {
        const list = (sec === "auxiliary" ? pool.filter(t => AUX_TENSES.includes(t)) : pool);
        const usable = list.length ? list : ["present_simple"];
        const names = usable.map(t => TENSES[t]).join(", ");
        return callClaude(promptFor(sec, count, names), GEN_SYS).then(r => validate(sec, (r.items || []).slice(0, count)));
      });
      const results = await Promise.all([...tenseP, readingOn ? genReading() : Promise.resolve(null)]);
      const readingRes = results.pop();
      const all = results.flat();
      if (all.length < chosen.length) throw new Error("thin");
      if (readingOn && !readingRes) throw new Error("no reading");
      setItems(all); setReading(readingRes);
      setAnswers({}); setMarks({}); setAi({}); setExplains({}); setExplaining(false); setOpenFb({}); setGradingOpen(false); setGraded(false);
      setScreen("test");
      preExplain(all.filter(it => it.section !== "wh")); // prepare tense explanations in the background while the student works
    } catch {
      setError("לא הצלחתי לייצר מבחן כרגע. נסה שוב — לרוב זה עובד בניסיון השני.");
      setScreen("setup");
    }
  }

  function isCorrect(it, ans) {
    if (it.section === "circle") return ans === it.correct;
    return it.answers.map(norm).includes(norm(ans));
  }
  function submit() {
    const m = {};
    items.forEach(it => { m[it.id] = isCorrect(it, answers[it.id]); });
    if (reading) {
      reading.complete.forEach(it => { m[it.id] = !!answers[it.id] && it.answers.map(norm).includes(norm(answers[it.id])); });
      reading.truefalse.forEach(it => { m[it.id] = (typeof answers[it.id] === "boolean") && answers[it.id] === it.isTrue; });
      // answer-in-full is graded by AI below (left undefined until then)
    }
    setMarks(m); setGraded(true);
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
    // tense explanations are usually already prepared in the background; backfill any missing
    const missing = items.filter(it => it.section !== "wh" && !m[it.id] && !explains[it.id]);
    if (missing.length) preExplain(missing);
    if (reading && reading.answer.length) gradeOpen(reading);
  }

  // Generate detailed Hebrew explanations up front, in the background, so they
  // appear instantly the moment an answer is marked wrong. Updates incrementally.
  async function preExplain(list) {
    if (!list.length) return;
    setExplaining(true);
    const describe = (it) => ({
      id: it.id,
      type: it.section,
      sentence: it.section === "circle" ? it.stem : it.sentence,
      tense: TENSES[it.tense],
      correct_answer: it.section === "circle" ? it.options[it.correct] : it.answers[0],
      ...(it.section === "verb" ? { base_verb: it.verb, negative: !!it.negative } : {}),
    });
    const chunks = [];
    for (let i = 0; i < list.length; i += 6) chunks.push(list.slice(i, i + 6));
    const sys = "You are a warm, clear English teacher for a 7th-grade native Hebrew speaker. Write in simple Hebrew. Output ONLY valid JSON.";
    await Promise.all(chunks.map(async (ch) => {
      try {
        const user = `For each item write a short Hebrew explanation of 2–3 sentences covering, in order: (1) which TIME WORD in the sentence signals the tense and which tense it is; (2) the grammar RULE and the correct STRUCTURE of the answer (how to build it). Simple and friendly, like a good teacher. Items: ${JSON.stringify(ch.map(describe))}\nReturn ONLY JSON: {"explanations":[{"id":"v0","text_he":"..."}]}`;
        const r = await callClaude(user, sys);
        setExplains(prev => {
          const mp = { ...prev };
          (r.explanations || []).forEach(e => { if (e && e.id && !mp[e.id]) mp[e.id] = e.text_he; });
          return mp;
        });
      } catch { /* fall back to the short explanation_he already on each item */ }
    }));
    setExplaining(false);
  }

  async function recheck(it) {
    setAi(a => ({ ...a, [it.id]: { loading: true } }));
    const stem = it.section === "circle" ? it.stem : it.sentence;
    const exp = it.section === "circle" ? it.options[it.correct] : it.answers.join(", ");
    const wrote = it.section === "circle" ? it.options[answers[it.id]] : answers[it.id];
    const user = `English test item (${it.section}): "${stem}". Target tense: ${TENSES[it.tense]}. Expected: ${exp}. Student wrote: "${wrote}". Is it grammatically correct and acceptable here? Reply ONLY JSON: {"correct": true, "feedback_he": "הסבר קצר בעברית"}`;
    try {
      const r = await callClaude(user, "You judge English test answers. Output ONLY valid JSON.");
      if (r.correct && !marks[it.id]) setMarks(m => ({ ...m, [it.id]: true }));
      setAi(a => ({ ...a, [it.id]: { loading: false, done: true, correct: !!r.correct, text: r.feedback_he || "" } }));
    } catch {
      setAi(a => ({ ...a, [it.id]: { loading: false, done: true, correct: false, text: "לא הצלחתי לבדוק כרגע." } }));
    }
  }

  async function gradeOpen(rd) {
    setGradingOpen(true);
    const payload = rd.answer.map(q => ({ id: q.id, question: q.question, model: q.model_en, key_points: q.key_points, student: answers[q.id] || "(left blank)" }));
    const user = `A 7th-grade student answered reading-comprehension questions about a passage. For each, decide if the answer is essentially correct — it must capture the key points; spelling and grammar can be imperfect. Be kind but fair; a blank or off-topic answer is incorrect. Reply ONLY JSON: {"results":[{"id":"ra0","correct":true,"feedback_he":"הערה קצרה בעברית"}]}. Items: ${JSON.stringify(payload)}`;
    try {
      const r = await callClaude(user, "You kindly grade 7th-grade reading answers. Output ONLY valid JSON.");
      const upd = {}, fb = {};
      (r.results || []).forEach(x => { if (x && x.id) { upd[x.id] = !!x.correct; fb[x.id] = x.feedback_he || ""; } });
      setMarks(prev => ({ ...prev, ...upd }));
      setOpenFb(fb);
    } catch { /* leave ungraded; the model answer is shown for self-check */ }
    finally { setGradingOpen(false); }
  }

  const bySection = SECTION_ORDER.filter(s => sections.has(s)).map(s => ({ s, list: items.filter(i => i.section === s) })).filter(x => x.list.length);
  const readingItems = reading ? [...reading.complete, ...reading.truefalse, ...reading.answer] : [];
  const allGradable = [...items, ...readingItems];
  const total = allGradable.length;
  const correctCount = allGradable.filter(i => marks[i.id]).length;
  const pct = total ? Math.round((correctCount / total) * 100) : 0;
  const gradeWord = pct >= 90 ? "Excellent!" : pct >= 75 ? "Very good" : pct >= 55 ? "Good, keep going" : "Keep practising";

  /* ---------------- SETUP ---------------- */
  if (screen === "setup") {
    return (
      <div className="ws-root"><style>{STYLE}</style>
        <div className="ws-setup">
          <p className="ws-eyebrow">תרגול אנגלית · מבוסס AI</p>
          <h1 className="ws-h1">מבחן הזמנים</h1>
          <p className="ws-lead">תרגול בסגנון דף מבחן של כיתה ז', באותה רמה כמו בדף. ה-AI מרכיב מבחן חדש, אתה ממלא הכול בעט על הדף, ובסוף "המורה" בודקת עם ✓/✗ אדום-ירוק וציון מוקף בעיגול. על כל שאלה שטעית בה תקבל הסבר מפורט: איזו מילת זמן חושפת את הזמן, מה הכלל הדקדוקי, ולמה התשובה שלך שגויה.</p>
          <div className="ws-panel">
            <p className="ws-flabel">חלקי המבחן</p>
            <div className="ws-chips">
              {SECTION_ORDER.map(s => (
                <span key={s} className="ws-chip" data-on={sections.has(s)} role="button" tabIndex={0}
                      onClick={() => toggle(setSections, sections, s)}
                      onKeyDown={e => (e.key === "Enter" || e.key === " ") && toggle(setSections, sections, s)}>
                  {SECTIONS[s].letter}) {SECTIONS[s].he}
                </span>
              ))}
              <span className="ws-chip" data-on={sections.has("reading")} role="button" tabIndex={0}
                    onClick={() => toggle(setSections, sections, "reading")}
                    onKeyDown={e => (e.key === "Enter" || e.key === " ") && toggle(setSections, sections, "reading")}>
                הבנת הנקרא (Unseen)
              </span>
            </div>

            <p className="ws-flabel">מאגר הזמנים (מעורבים בשאלות)</p>
            <div className="ws-chips">
              {Object.keys(TENSES).map(t => (
                <span key={t} className="ws-chip" data-on={tenses.has(t)} role="button" tabIndex={0}
                      onClick={() => toggle(setTenses, tenses, t)}
                      onKeyDown={e => (e.key === "Enter" || e.key === " ") && toggle(setTenses, tenses, t)}>
                  {TENSE_HE[t]}
                </span>
              ))}
            </div>

            <p className="ws-flabel">שאלות בכל חלק</p>
            <div className="ws-chips" style={{ marginBottom: 26 }}>
              {[5, 8].map(c => (
                <span key={c} className="ws-chip" data-on={count === c} role="button" tabIndex={0}
                      onClick={() => setCount(c)} onKeyDown={e => (e.key === "Enter" || e.key === " ") && setCount(c)}>{c}</span>
              ))}
            </div>

            <button className="ws-start" disabled={sections.size === 0} onClick={generate}>
              הכן מבחן · {SECTION_ORDER.filter(s => sections.has(s)).length * count + (sections.has("reading") ? 13 : 0)} שאלות
            </button>
            {error && <div className="ws-err">{error}</div>}
          </div>
        </div>
      </div>
    );
  }

  /* ---------------- LOADING ---------------- */
  if (screen === "loading") {
    return (
      <div className="ws-root"><style>{STYLE}</style>
        <div className="ws-setup">
          <div className="ws-panel"><div className="ws-loading"><div className="ws-spin" /><p>מרכיבים מבחן טרי…</p></div></div>
        </div>
      </div>
    );
  }

  /* ---------------- TEST PAGE ---------------- */
  let n = 0; // running item number across the page
  return (
    <div className="ws-root"><style>{STYLE}</style>
      <div className="ws-page">
        {graded && (
          <div className="ws-grade">
            <div className="num">{pct}</div>
            <div className="word">{gradeWord}</div>
          </div>
        )}

        <div className="ws-headline">
          <h2>English Test · 7<sup>th</sup> grade</h2>
          <p>Mixed Tenses</p>
        </div>

        <div className="ws-metarow">
          <span className="ws-field">Name <input value={meta.name} disabled={graded} onChange={e => setMeta({ ...meta, name: e.target.value })} /></span>
          <span className="ws-field">Class <input style={{ width: 60 }} value={meta.cls} disabled={graded} onChange={e => setMeta({ ...meta, cls: e.target.value })} /></span>
          <span className="ws-field">Date <input style={{ width: 90 }} value={meta.date} disabled={graded} onChange={e => setMeta({ ...meta, date: e.target.value })} /></span>
          <span className="ws-row-badge">Row A</span>
        </div>
        <p className="ws-instr">Answer all the questions. Then hand in your test.</p>
        <hr className="ws-divider" />

        {reading && (
          <section className="ws-sec">
            <div className="ws-sec-h">
              <span className="lhs">Reading Comprehension<span className="he"> · הבנת הנקרא</span></span>
              <span className="pts">(unseen)</span>
            </div>
            <div className="ws-passage">
              <h3>{reading.title}</h3>
              <p>{reading.passage}</p>
            </div>

            <div className="ws-subh">1. Complete the sentences<span className="he"> · השלם את המשפטים</span></div>
            {reading.complete.map((it, i) => {
              const a = answers[it.id]; const ok = marks[it.id]; const wrong = graded && !ok;
              const cls = "ws-item" + (graded ? (ok ? " answered-ok" : " answered-wrong") : "");
              const parts = it.sentence.split("___");
              return (
                <div className={cls} key={it.id}>
                  {graded && <span className={"ws-mark " + (ok ? "ok" : "bad")}>{ok ? "✓" : "✗"}</span>}
                  <div className="ws-line">
                    <span className="ws-num">{i + 1})</span>
                    <span>{parts[0]}
                      <input className="ws-blank" style={{ width: `${Math.max(5, (a || "").length + 2)}ch` }}
                             value={a || ""} disabled={graded} placeholder="…"
                             onChange={e => setAnswers({ ...answers, [it.id]: e.target.value })} />
                      {parts[1] || ""}</span>
                  </div>
                  {wrong && (
                    <div className="ws-notewrap">
                      <div className="ws-corr">→ <span className="corr">{it.answers[0]}</span></div>
                      <div className="ws-explain"><div className="hd">מהטקסט:</div><div className="bd">{it.explanation_he}</div></div>
                    </div>
                  )}
                </div>
              );
            })}

            <div className="ws-subh">2. True or false<span className="he"> · נכון / לא נכון</span></div>
            {reading.truefalse.map((it, i) => {
              const a = answers[it.id]; const ok = marks[it.id]; const wrong = graded && !ok;
              const cls = "ws-item" + (graded ? (ok ? " answered-ok" : " answered-wrong") : "");
              return (
                <div className={cls} key={it.id}>
                  {graded && <span className={"ws-mark " + (ok ? "ok" : "bad")}>{ok ? "✓" : "✗"}</span>}
                  <div className="ws-line">
                    <span className="ws-num">{i + 1})</span> <span>{it.statement}</span>
                    <span className="ws-tf">
                      {[["true", true], ["false", false]].map(([lbl, val]) => (
                        <span key={lbl} className="ws-opt" role="button" tabIndex={0}
                              data-sel={a === val} data-correct={graded && it.isTrue === val}
                              onClick={() => !graded && setAnswers({ ...answers, [it.id]: val })}
                              onKeyDown={e => !graded && (e.key === "Enter" || e.key === " ") && setAnswers({ ...answers, [it.id]: val })}>
                          {lbl}{graded && it.isTrue === val && <span className="miniv">✓</span>}
                        </span>
                      ))}
                    </span>
                  </div>
                  {wrong && (
                    <div className="ws-notewrap">
                      <div className="ws-explain"><div className="hd">התשובה הנכונה: {it.isTrue ? "true" : "false"}</div><div className="bd">{it.explanation_he}</div></div>
                    </div>
                  )}
                </div>
              );
            })}

            {reading.answer.length > 0 && (
              <>
                <div className="ws-subh">3. Answer the questions in full<span className="he"> · ענה במשפט מלא</span></div>
                {reading.answer.map((it, i) => {
                  const a = answers[it.id]; const ok = marks[it.id];
                  const cls = "ws-item" + (graded ? (ok ? " answered-ok" : (ok === false ? " answered-wrong" : "")) : "");
                  return (
                    <div className={cls} key={it.id}>
                      {graded && ok !== undefined && <span className={"ws-mark " + (ok ? "ok" : "bad")}>{ok ? "✓" : "✗"}</span>}
                      <div className="ws-line">
                        <span className="ws-num">{i + 1})</span> <span>{it.question}</span>
                      </div>
                      <textarea className="ws-answerbox" value={a || ""} disabled={graded}
                                placeholder="…" onChange={e => setAnswers({ ...answers, [it.id]: e.target.value })} />
                      {graded && (
                        <div className="ws-notewrap">
                          {ok === undefined
                            ? <div className="ws-explain"><div className="bd wait">{gradingOpen ? "המורה בודקת את התשובה…" : "בדיקה עצמית מול התשובה למטה"}</div></div>
                            : (!ok && openFb[it.id] && <div className="ws-explain"><div className="hd">הערת המורה:</div><div className="bd">{openFb[it.id]}</div></div>)}
                          <div className="ws-model"><b>answer:</b> {it.model_en}</div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </>
            )}
          </section>
        )}

        {bySection.map(({ s, list }, si) => (
          <section className="ws-sec" key={s}>
            <div className="ws-sec-h">
              <span className="lhs">
                {SECTIONS[s].letter}) {SECTIONS[s].en}
                <span className="he"> · {SECTIONS[s].he}</span>
              </span>
              <span className="pts">({list.length} × 2 points)</span>
            </div>

            {list.map((it) => {
              n += 1;
              const a = answers[it.id];
              const ok = marks[it.id];
              const wrong = graded && !ok;
              const air = ai[it.id] || {};
              const cls = "ws-item" + (graded ? (ok ? " answered-ok" : " answered-wrong") : "");

              if (it.section === "circle") {
                const parts = it.stem.split("___");
                return (
                  <div className={cls} key={it.id}>
                    {graded && <span className={"ws-mark " + (ok ? "ok" : "bad")}>{ok ? "✓" : "✗"}</span>}
                    <div className="ws-line">
                      <span className="ws-num">{n})</span>
                      <span>{parts[0]}{parts.length > 1 && <span className="ws-fillline" />}{parts[1] || ""}</span>
                    </div>
                    <div className="ws-opts">
                      {it.options.map((opt, oi) => (
                        <span key={oi} className="ws-opt" role="button" tabIndex={0}
                              data-sel={a === oi} data-correct={graded && oi === it.correct}
                              onClick={() => !graded && setAnswers({ ...answers, [it.id]: oi })}
                              onKeyDown={e => !graded && (e.key === "Enter" || e.key === " ") && setAnswers({ ...answers, [it.id]: oi })}>
                          <span className="lt">{LETTERS[oi]}.</span>{opt}
                          {graded && oi === it.correct && <span className="miniv">✓</span>}
                        </span>
                      ))}
                    </div>
                    {wrong && (
                      <div className="ws-notewrap">
                        <div className="ws-corr">correct: <span className="corr">{it.options[it.correct]}</span></div>
                        <div className="ws-explain">
                          <div className="hd">איך מזהים את הזמן ומה הכלל:</div>
                          {explains[it.id]
                            ? <div className="bd">{explains[it.id]}</div>
                            : <div className="bd wait">{explaining ? "המורה כותבת הסבר מפורט…" : it.explanation_he}</div>}
                        </div>
                      </div>
                    )}
                  </div>
                );
              }

              // verb & auxiliary: single blank
              const parts = it.sentence.split("___");
              return (
                <div className={cls} key={it.id}>
                  {graded && <span className={"ws-mark " + (ok ? "ok" : "bad")}>{ok ? "✓" : "✗"}</span>}
                  <div className="ws-line">
                    <span className="ws-num">{n})</span>
                    <span>
                      {parts[0]}
                      <input className="ws-blank" style={{ width: `${Math.max(5, (a || "").length + 2)}ch` }}
                             value={a || ""} disabled={graded} placeholder="…"
                             onChange={e => setAnswers({ ...answers, [it.id]: e.target.value })} />
                      {parts[1] || ""}
                      {it.section === "verb" && <span className="ws-hint">({it.negative ? "not " : ""}{it.verb})</span>}
                    </span>
                  </div>
                  {wrong && (
                    <div className="ws-notewrap">
                      <div className="ws-corr">→ <span className="corr">{it.answers[0]}</span></div>
                      <div className="ws-explain">
                        <div className="hd">{it.section === "wh" ? "איזו מילת שאלה ולמה:" : "איך מזהים את הזמן ומה הכלל:"}</div>
                        {it.section === "wh"
                          ? <div className="bd">{it.explanation_he}</div>
                          : (explains[it.id]
                              ? <div className="bd">{explains[it.id]}</div>
                              : <div className="bd wait">{explaining ? "המורה כותבת הסבר מפורט…" : it.explanation_he}</div>)}
                      </div>
                      {!air.done ? (
                        <button className="ws-recheck" disabled={air.loading} onClick={() => recheck(it)}>
                          {air.loading ? "בודק…" : "אני חושב שצדקתי — בדוק עם AI"}
                        </button>
                      ) : (
                        <div className="ws-ai">{air.correct ? "ה-AI מאשר: התשובה שלך תקינה ✓ " : "ה-AI: "}{air.text}</div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </section>
        ))}

        <div className="ws-footer">{graded ? `${correctCount} / ${total} correct` : "Good luck!"}</div>
      </div>

      {graded && <p className="ws-summary">ציון {pct} · {correctCount} מתוך {total} נכונות. הערות המורה מופיעות ליד כל שאלה שנפלה.</p>}

      <div className="ws-bar">
        {!graded ? (
          <button className="ws-btn" onClick={submit}>הגש לבדיקה</button>
        ) : (
          <>
            <button className="ws-btn" onClick={generate}>מבחן חדש · אותן הגדרות</button>
            <button className="ws-btn ghost" onClick={() => { setScreen("setup"); setError(""); }}>שינוי הגדרות</button>
          </>
        )}
        <button className="ws-btn ghost" onClick={() => window.print()}>הדפסה</button>
      </div>
    </div>
  );
}


function Gate() {
  const [authed, setAuthed] = useState(null);
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => { fetch("/api/me").then(r => r.json()).then(d => setAuthed(!!d.authed)).catch(() => setAuthed(false)); }, []);
  async function submit() {
    if (busy) return;
    setBusy(true); setErr("");
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: user.trim(), pass }) });
      const d = await r.json();
      if (d.ok) setAuthed(true); else setErr("שם משתמש או סיסמה שגויים");
    } catch { setErr("שגיאה בהתחברות, נסו שוב"); } finally { setBusy(false); }
  }
  if (authed === null) return (<div className="gate"><div className="gate-card"><div className="sub">רגע…</div></div></div>);
  if (authed) return <EnglishTest />;
  return (
    <div className="gate">
      <div className="gate-card">
        <h1>מבחן הזמנים</h1>
        <div className="sub">כניסה לתרגול</div>
        <div className="gate-field"><label>שם משתמש</label>
          <input value={user} onChange={e => setUser(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} autoFocus /></div>
        <div className="gate-field"><label>סיסמה</label>
          <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} /></div>
        <button className="gate-btn" disabled={busy} onClick={submit}>{busy ? "מתחבר…" : "כניסה"}</button>
        <div className="gate-err">{err}</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Gate />);

</script>
</body>
</html>
